# =============================================================================
# Custom Credential Type AAP : "Satellite & Wazuh SIEM Secrets"
# À créer dans AAP : Administration -> Credential Types -> Add
# Permet d'injecter l'Activation Key Satellite et les mots de passe Wazuh
# comme variables d'environnement chiffrées dans l'Execution Environment.
# =============================================================================

# --- Input Configuration (YAML) ---
fields:
  - id: satellite_activation_key
    type: string
    label: "Red Hat Satellite Activation Key"
    secret: true
  - id: wazuh_indexer_password
    type: string
    label: "Wazuh Indexer Admin Password (optionnel)"
    secret: true
  - id: wazuh_api_password
    type: string
    label: "Wazuh API Password (optionnel)"
    secret: true
  - id: wazuh_dashboard_password
    type: string
    label: "Wazuh Dashboard Password (optionnel)"
    secret: true
required:
  - satellite_activation_key

# --- Injector Configuration (YAML) ---
# (À copier dans le champ "Injector Configuration" de AAP)
# env:
#   SATELLITE_ACTIVATION_KEY: '{{ satellite_activation_key }}'
#   WAZUH_INDEXER_PASSWORD: '{{ wazuh_indexer_password }}'
#   WAZUH_API_PASSWORD: '{{ wazuh_api_password }}'
#   WAZUH_DASHBOARD_PASSWORD: '{{ wazuh_dashboard_password }}'
