---
- name: Patching RHEL OS and Security Updates
  hosts: all
  become: yes
  vars:
    # Use environment variables if proxy is needed
    proxy_env:
      http_proxy: "{{ lookup('env', 'http_proxy') | default('', true) }}"
      https_proxy: "{{ lookup('env', 'https_proxy') | default('', true) }}"

  tasks:
    - name: Verify that the host is registered with Red Hat Satellite
      ansible.builtin.command: subscription-manager status
      register: satellite_status
      failed_when: satellite_status.rc != 0
      changed_when: false

    - name: Run DNF security update
      ansible.builtin.dnf:
        name: "*"
        state: latest
        security: yes
        update_cache: yes
      environment: "{{ proxy_env if proxy_env.http_proxy != '' else {} }}"
      register: dnf_update

    - name: Check if reboot is required (RHEL)
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: Reboot server if required
      ansible.builtin.reboot:
        msg: "Reboot initiated by Ansible patching playbook"
        connect_timeout: 5
        reboot_timeout: 300
        pre_reboot_delay: 0
        post_reboot_delay: 30
      when: reboot_required_file.stat.exists or dnf_update.changed
